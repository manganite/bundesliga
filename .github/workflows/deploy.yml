name: Nach GitHub Pages deployen

# Publishes ONLY apps/public (§10). App B is never deployed and never linked —
# „privat" means „not published as a website", and that is enforced here rather
# than left to discipline.
on:
  push:
    branches: [main]
    paths:
      - "apps/public/**"
      - "packages/**"
      - "pipeline/**"
      # `data/**` fängt hier NUR menschliche Pushes (committete Historien-
      # Artefakte, Handkorrekturen). Die Datencommits des Crons erreichen diesen
      # Trigger nicht — ein Push mit dem GITHUB_TOKEN löst keine Workflows aus.
      # data.yml stößt den Deploy deshalb selbst per workflow_dispatch an; wer
      # diesen Pfad hier für ausreichend hält, schaltet den Cron-Deploy ab.
      - "data/**"
      - "package.json"
      # A lockfile change alone can break the build — it did once, when a new
      # workspace was added without regenerating it and `npm ci` refused.
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
      # The test workflow IS the deployment gate (see the `test` job below), so
      # a change to it changes what deploying means.
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The tests are the precondition, not a step inside the build: no green suite,
  # no deployment. Calling the shared workflow rather than repeating `npm test`
  # here means the deployment gate and the branch gate cannot drift apart — and
  # a failure reads as „Tests" in the run list instead of hiding inside „build".
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned Node version (§5.5 dependency hygiene). It must satisfy the
      # engine constraints of the build toolchain's OPTIONAL native bindings:
      # rolldown's linux-x64-gnu binding requires ^20.19.0 || >=22.12.0, and npm
      # silently SKIPS an optional dependency whose engine constraint fails —
      # the build then dies with MODULE_NOT_FOUND far from the real cause.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - run: npm ci

      # `prebuild` syncs the committed data into the app's public directory.
      # There is no browser-side live fetch — the site serves only what this
      # repository committed (§5.1).
      - run: npm run build --workspace @bundesliga/app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/public/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # `needs` covers ALL THREE jobs, not just `deploy`. The failure that hid for
  # two days was in `test`: the gate went red, `build` and `deploy` were skipped,
  # and a reporter hanging off `deploy` alone would have stayed silent through
  # exactly the outage it exists for.
  melden:
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Rot melden
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETRIEB_STATUS: rot
          BETRIEB_WORKFLOW: deploy
          BETRIEB_TITEL: Nach GitHub Pages deployen
          BETRIEB_LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/betrieb-melden.sh

      # This workflow uses `cancel-in-progress: true` on the pages group, so
      # cancellation is ROUTINE here — two data commits in quick succession cancel
      # the older deploy. It must never be read as either red or green.
      - name: Grün melden
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETRIEB_STATUS: gruen
          BETRIEB_WORKFLOW: deploy
          BETRIEB_TITEL: Nach GitHub Pages deployen
          BETRIEB_LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/betrieb-melden.sh
