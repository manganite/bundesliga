name: Daten aktualisieren

# The scheduled run is the ONLY data path (§5.1). There is no browser-side live
# fetch: committed files are the single source, so the app can never show a
# state that mixes committed and freshly fetched data.
on:
  schedule:
    # Every two hours. Off-season this simply finds nothing new and commits
    # nothing — which is the intended behaviour, not a fault.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Nötig für den expliziten Deploy-Anstoß unten. Ein Push mit dem
  # GITHUB_TOKEN löst KEINE weiteren Workflows aus (GitHubs Rekursionsschutz),
  # deshalb muss dieser Job den Deploy selbst anstoßen.
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned Node version (§5.5 dependency hygiene).
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      # The pipeline has no dependencies beyond Node itself, so there is nothing
      # to install and nothing to pin beyond the runtime.
      #
      # INCIDENT 2026-08-20: clubelo rebuilt its website and switched the API off
      # before bringing it up on the new server (operator's own channel; no
      # return date given). api.clubelo.com accepts TCP connections and never
      # answers, so every run fails at the ratings gate and NOTHING is committed,
      # results included.
      #
      # The flag lets an unreachable clubelo fall back to the archive, bounded
      # and marked (update.mjs §3). It expires 2026-08-28 because that is the day
      # it stops helping anyway: BL1 matchday 1 and BL2 matchday 3 kick off, a
      # known fixture falls in the gap, and the carry-forward evaluation refuses
      # by design. Per the standing rule — set per incident, with an explicit
      # expiry, and REMOVED once the incident is over.
      - name: Pipeline ausführen
        id: pipeline
        run: node pipeline/src/cli.mjs --data-dir data --carry-forward-until 2026-08-28

      # Commit only on change. A run that found nothing new leaves the
      # repository untouched, so dataUpdatedAt does not move and no deployment
      # is triggered.
      - name: Änderungen committen
        id: commit
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Pipeline meldete eine Änderung, der Baum ist aber unverändert — nichts zu committen."
            exit 0
          fi
          git commit -m "Daten: Saison ${{ steps.pipeline.outputs.season }} aktualisiert"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Der Deploy MUSS hier explizit angestoßen werden. deploy.yml lauscht auf
      # `push` mit `paths: data/**` — diese Bedingung ist erfüllt, der Trigger
      # feuert trotzdem nie: GitHub löst aus einem Push, der mit dem
      # GITHUB_TOKEN erfolgt, grundsätzlich keine weiteren Workflows aus
      # (Rekursionsschutz). Der Datenstand im Repo lief dadurch dem
      # ausgelieferten Stand hinterher, bis irgendein Mensch etwas pushte; die
      # App zeigte am 2026-08-08 noch den Stand vom 2026-08-05 und damit das
      # Eröffnungsspiel der 2. Liga als ungespielt.
      #
      # Warum nicht der offensichtlichere Weg: ein PAT statt GITHUB_TOKEN würde
      # den Push-Trigger scharf machen, kauft das aber mit einem dauerhaft
      # gelagerten Schreib-Token und einer stillen Kopplung — der Grund stünde
      # nirgends im Repo. Der explizite Dispatch steht dort, wo er wirkt.
      #
      # Kein `if: always()` — nur ein tatsächlich gepushter Commit rechtfertigt
      # ein Deployment; „commit only on change" bleibt damit auch „deploy only
      # on change".
      - name: Deploy anstoßen
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

  # Workflow health is signalled OUTSIDE the repository — never as a status field
  # in committed data, which would contradict §5.1 and let the app derive a
  # health claim from data. An issue is the channel that actually reaches the
  # operator; the built-in failure mail does not, reliably, for a run started by
  # a bot dispatch.
  melden:
    needs: [update]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Rot melden
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETRIEB_STATUS: rot
          BETRIEB_WORKFLOW: data
          BETRIEB_TITEL: Daten aktualisieren
          BETRIEB_LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/betrieb-melden.sh

      # Deliberately not `if: success()`: a CANCELLED run says nothing about
      # health and must neither open nor close the marker.
      - name: Grün melden
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETRIEB_STATUS: gruen
          BETRIEB_WORKFLOW: data
          BETRIEB_TITEL: Daten aktualisieren
          BETRIEB_LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/betrieb-melden.sh

# On failure the job simply fails. Nothing is committed and no status field is
# written into the repository — the two contradict, and the app must not derive
# a workflow-health claim from committed data (§5.1). The failure is surfaced by
# the `melden` job above, as an issue rather than as data.
